[package]
name = "grok-search-rs"
version = "0.1.18"
edition = "2021"
authors = ["CrystalEchoJ <cyansparkjolt@outlook.com>"]
license = "MIT"
repository = "https://github.com/CrystalEchoJ/GrokSearch-rs"
description = "AI-powered web search with cited sources via stdio MCP — Grok/xAI, Tavily, Firecrawl, and OpenAI-compatible"
keywords = ["search", "grok", "tavily", "firecrawl", "mcp", "web-search"]
categories = ["web-programming", "command-line-utilities"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
percent-encoding = "2"
quick-xml = { version = "0.37", default-features = false, features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
wiremock = "0.6"

[profile.release]
panic = "abort"
lto = true
